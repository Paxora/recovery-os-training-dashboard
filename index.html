<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f4f7" />
    <title>Recovery OS · Training Dashboard</title>
    <style>
      :root {
        color-scheme: light;
        --blue: #2f6ff6;
        --ink: #11141b;
        --muted: #687080;
        --line: #dfe2e8;
        --surface: #ffffff;
        --background: #f3f4f7;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        background:
          radial-gradient(circle at 85% 8%, rgba(47, 111, 246, 0.1), transparent 30%),
          var(--background);
        color: var(--ink);
        font-family:
          -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      }

      main {
        width: min(100%, 720px);
        min-height: 100vh;
        margin: 0 auto;
        padding:
          max(56px, env(safe-area-inset-top))
          24px
          max(40px, env(safe-area-inset-bottom));
        display: flex;
        flex-direction: column;
      }

      .eyebrow {
        margin: 0 0 18px;
        color: var(--blue);
        font-size: 15px;
        font-weight: 800;
        letter-spacing: 0.18em;
      }

      h1 {
        max-width: 640px;
        margin: 0;
        font-size: clamp(48px, 12vw, 86px);
        line-height: 0.98;
        letter-spacing: -0.065em;
      }

      .subtitle {
        max-width: 540px;
        margin: 24px 0 0;
        color: var(--muted);
        font-size: 18px;
        line-height: 1.65;
      }

      .card {
        margin-top: 52px;
        padding: 28px;
        border: 1px solid rgba(255, 255, 255, 0.7);
        border-radius: 32px;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 20px 60px rgba(35, 43, 60, 0.08);
      }

      .number {
        width: 100%;
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: #f4f5f8;
        color: var(--muted);
        text-align: center;
        font-size: 18px;
        font-weight: 800;
      }

      .card h2 {
        margin: 30px 0 10px;
        font-size: 30px;
        letter-spacing: -0.04em;
      }

      .card p {
        margin: 0;
        color: var(--muted);
        font-size: 16px;
        line-height: 1.65;
      }

      .notice {
        margin-top: 24px;
        padding: 18px;
        border-radius: 20px;
        background: #f4f6fb;
      }

      .notice strong {
        display: block;
        margin-bottom: 6px;
        font-size: 16px;
      }

      .notice p {
        font-size: 14px;
      }

      .primary {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        margin-top: 24px;
        padding: 19px 22px;
        border-radius: 999px;
        background: var(--ink);
        color: white;
        text-decoration: none;
        font-size: 17px;
        font-weight: 750;
      }

      .primary span:last-child {
        color: #a9c3ff;
        font-size: 22px;
      }

      footer {
        margin-top: auto;
        padding-top: 36px;
        color: #9298a4;
        font-size: 13px;
      }

      @media (max-width: 520px) {
        main {
          padding-left: 20px;
          padding-right: 20px;
        }

        .card {
          margin-top: 40px;
          padding: 20px;
          border-radius: 26px;
        }

        .card h2 {
          font-size: 27px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">RECOVERY OS</p>
        <h1>训练 Dashboard</h1>
        <p class="subtitle">
          这是 Recovery OS Training Dashboard 的固定入口。训练现场执行、逐组记录和历史回看都在云端版完成。
        </p>
      </header>

      <section class="card" aria-labelledby="entry-title">
        <div class="number">01</div>
        <h2 id="entry-title">进入云端训练看板</h2>
        <p>训练数据保持私有，并保存至云端历史记录。</p>

        <div class="notice">
          <strong>打开前请确认</strong>
          <p>请使用普通浏览窗口，并登录获准访问的 ChatGPT 账号。无痕浏览无法进入私有 Dashboard。</p>
        </div>

        <a
          class="primary"
          href="https://recovery-os-training-dashboard.panaker.chatgpt.site/"
          rel="noopener"
        >
          <span>打开 Dashboard</span>
          <span aria-hidden="true">↗</span>
        </a>
      </section>

      <footer>Recovery OS · Private training workspace</footer>
    </main>
  </body>
</html>
