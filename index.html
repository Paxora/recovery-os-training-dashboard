<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f5f8" />
    <meta name="description" content="Recovery OS 手机优先训练执行与记录 Dashboard" />
    <meta property="og:title" content="Recovery OS · Training Dashboard" />
    <meta property="og:description" content="训练现场执行、逐组记录与历史回看。" />
    <meta property="og:image" content="./recovery-os-training-dashboard-og.png" />
    <title>Recovery OS · Training Dashboard</title>
    <link rel="stylesheet" href="./style.css?v=20260725-3" />
  </head>
  <body>
    <main class="auth-shell" id="auth-shell">
      <section class="auth-card">
        <p class="eyebrow">RECOVERY OS</p>
        <h1 id="auth-title">登录训练 Dashboard</h1>
        <p id="auth-copy">使用你的 GitHub 账号登录。训练记录会按账号隔离并保存到云端历史。</p>
        <button class="auth-button" id="github-login" type="button">
          <span>使用 GitHub 登录</span>
          <span aria-hidden="true">↗</span>
        </button>
        <p class="auth-status" id="auth-status" role="status"></p>
      </section>
    </main>

    <main class="app-shell" id="app-shell" hidden>
      <section data-view="workout">
        <header class="page-header">
          <div>
            <p class="eyebrow">TODAY'S WORKOUT</p>
            <h1>今日训练卡</h1>
            <p class="signed-in-label" id="signed-in-label"></p>
          </div>
          <button class="outline-button" id="open-history" type="button">历史</button>
        </header>

        <section class="progress-card" aria-label="训练进度">
          <div>
            <span>今日训练 · Session 02</span>
            <strong id="progress-count">0 / 7</strong>
          </div>
          <div class="progress-track"><span id="progress-bar"></span></div>
        </section>

        <div class="exercise-list" id="exercise-list"></div>

        <aside class="safety-strip">
          <strong>!</strong>
          <span>胸痛、胸闷、头晕或异常气短，立即停止训练。</span>
        </aside>

        <p class="save-status" id="save-status" role="status"></p>
        <div class="sticky-actions">
          <button class="secondary-button" id="reset-training" type="button">重置本次</button>
          <button class="primary-button" id="save-session" type="button">结束并保存</button>
        </div>
      </section>

      <section data-view="history" hidden>
        <header class="page-header history-header">
          <div>
            <button class="back-button" data-open-view="workout" type="button">← 今日训练</button>
            <p class="eyebrow">TRAINING HISTORY</p>
            <h1>训练历史</h1>
          </div>
          <button class="outline-button" id="sign-out" type="button">退出</button>
        </header>

        <section class="history-summary">
          <span>已保存训练</span>
          <strong id="history-count">0 次</strong>
        </section>
        <div class="empty-state" id="history-status">正在读取训练历史…</div>
        <div class="history-list" id="history-list"></div>
      </section>
    </main>

    <script src="./config.js?v=20260725-3"></script>
    <script src="./app.js?v=20260725-3"></script>
  </body>
</html>
